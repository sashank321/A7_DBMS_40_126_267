version: "3.8"

services:
  # 1. Primary Relational Core with Vector capabilities
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgesphere_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sashank@123}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgesphere_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/sql/college/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/sql/college/02_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql
      - ./database/sql/extensions/01_advanced_features.sql:/docker-entrypoint-initdb.d/03_advanced_features.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledgesphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. NoSQL Document Store for high-velocity telemetry & reviews
  mongodb:
    image: mongo:7.0
    container_name: knowledgesphere_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. KnowledgeSphere AI FastAPI Backend
  backend:
    build: .
    container_name: knowledgesphere_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sashank@123}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgesphere_db}
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: knowledgesphere_nosql
      JWT_SECRET: ${JWT_SECRET:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      STORAGE_DIR: /app/storage/documents
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
  mongodata:
